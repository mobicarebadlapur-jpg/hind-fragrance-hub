name: Build Hostinger deploy branch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production server
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_USE_DEMO_MODE: ${{ secrets.VITE_USE_DEMO_MODE }}
        run: bun run build

      - name: Publish deploy artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the production Passenger entrypoint and Nitro standalone output.
          rm -rf /tmp/hostinger-deploy
          mkdir -p /tmp/hostinger-deploy
          cp -a .output /tmp/hostinger-deploy/.output
          cp app.js /tmp/hostinger-deploy/app.js
          cp package.json /tmp/hostinger-deploy/package.json

          # Hostinger installs this artifact with npm, so make the deploy-only
          # package metadata match Hostinger's package manager. Main stays Bun-based.
          # Use a real validation build command so Hostinger verifies the prebuilt
          # Nitro artifact instead of treating a pure no-op build as suspicious.
          node -e "const fs=require('fs'); const p='/tmp/hostinger-deploy/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.packageManager='npm@10'; j.scripts={...j.scripts,build:\"node -e \\\"const fs=require('fs'); const files=['.output/nitro.json','.output/server/index.mjs']; const dirs=['.output/server','.output/public']; for(const p of files){if(!fs.existsSync(p)||!fs.statSync(p).isFile()){console.error('[Hostinger] Missing artifact: '+p);process.exit(1)}} for(const p of dirs){if(!fs.existsSync(p)||!fs.statSync(p).isDirectory()){console.error('[Hostinger] Missing artifact directory: '+p);process.exit(1)}} console.log('[Hostinger] Prebuilt Nitro artifact validated; no rebuild required')\\\"\"}; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');"

          # Publish an orphan branch so main remains clean and .output stays ignored there.
          git switch --orphan deploy
          git rm -rf . >/dev/null 2>&1 || true
          # Remove ignored build output left by the checkout before copying the artifact.
          rm -rf .output app.js package.json
          cp -a /tmp/hostinger-deploy/.output .output
          cp /tmp/hostinger-deploy/app.js app.js
          cp /tmp/hostinger-deploy/package.json package.json

          git add -f .output app.js package.json
          git commit -m "deploy: build production artifact from ${GITHUB_SHA}"
          git push origin deploy --force

      - name: Deployment instructions
        run: |
          echo "Deploy artifact published to branch: deploy"
          echo "Configure Hostinger hPanel Git deployment to pull branch 'deploy'."
          echo "Hostinger application root must be the folder where this branch is deployed."
          echo "Startup file: app.js; Node.js: 22.x; Mode: Production."
