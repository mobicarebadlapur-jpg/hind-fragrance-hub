name: Build Hostinger deploy branch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production server
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_USE_DEMO_MODE: ${{ secrets.VITE_USE_DEMO_MODE }}
        run: bun run build

      - name: Verify Nitro artifact
        run: |
          set -euo pipefail
          test -f .output/nitro.json
          test -f .output/server/index.mjs
          test -d .output/server
          test -d .output/public
          test ! -e .output/.output
          grep -q '"preset": "node-server"' .output/nitro.json
          # A real TanStack Start artifact is multi-MB; an empty Nitro shell is <200kB.
          size=$(du -sk .output/server | cut -f1)
          echo "[CI] .output/server size: ${size}kB"
          test "$size" -gt 500
          test -d .output/public/assets
          echo "[CI] Nitro node-server artifact verified"

      - name: Smoke test production server
        run: |
          set -euo pipefail
          PORT=3123 node app.js > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3123/ && break; sleep 1; done
          code=$(curl -s -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:3123/)
          cat /tmp/smoke.log
          test "$code" = "200"
          echo "[CI] SSR smoke test passed"

      - name: Publish deploy artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the production Passenger entrypoint and Nitro standalone output.
          rm -rf /tmp/hostinger-deploy
          mkdir -p /tmp/hostinger-deploy
          cp -a .output /tmp/hostinger-deploy/.output
          cp app.js /tmp/hostinger-deploy/app.js
          cp package.json /tmp/hostinger-deploy/package.json

          # The Nitro node-server artifact is fully self-contained (.output/server
          # ships its own node_modules), so the deploy package.json carries NO
          # dependencies. Hostinger's "npm run build" only validates the artifact.
          cat > /tmp/hostinger-deploy/package.json <<'PKGJSON'
{
  "name": "hind-fragrance-hub-deploy",
  "private": true,
  "type": "module",
  "packageManager": "npm@10",
  "engines": { "node": ">=22 <23" },
  "scripts": {
    "build": "node ./validate-artifact.mjs",
    "start": "node app.js"
  }
}
PKGJSON

          cat > /tmp/hostinger-deploy/validate-artifact.mjs <<PKGVALIDATE
import fs from "node:fs";
const sourceSha = "${GITHUB_SHA}";
const files = [".output/nitro.json", ".output/server/index.mjs"];
const dirs = [".output/server", ".output/public", ".output/public/assets"];
for (const p of files) {
  if (!fs.existsSync(p) || !fs.statSync(p).isFile()) {
    console.error("[Hostinger] Missing artifact file: " + p);
    process.exit(1);
  }
}
for (const p of dirs) {
  if (!fs.existsSync(p) || !fs.statSync(p).isDirectory()) {
    console.error("[Hostinger] Missing artifact directory: " + p);
    process.exit(1);
  }
}
console.log("[Hostinger] Prebuilt Nitro artifact validated; no rebuild required");
console.log("[Hostinger] Artifact built from source commit: " + sourceSha);
PKGVALIDATE

          # Publish an orphan branch so main remains clean and .output stays ignored there.
          git switch --orphan deploy
          git rm -rf . >/dev/null 2>&1 || true
          # Remove ignored build output left by the checkout before copying the artifact.
          rm -rf .output app.js package.json validate-artifact.mjs
          cp -a /tmp/hostinger-deploy/.output .output
          cp /tmp/hostinger-deploy/app.js app.js
          cp /tmp/hostinger-deploy/package.json package.json
          cp /tmp/hostinger-deploy/validate-artifact.mjs validate-artifact.mjs

          git add -f .output app.js package.json validate-artifact.mjs
          git commit -m "deploy: build production artifact from ${GITHUB_SHA}"
          git push origin deploy --force

      - name: Deployment instructions
        run: |
          echo "Deploy artifact published to branch: deploy"
          echo "Configure Hostinger hPanel Git deployment to pull branch 'deploy'."
          echo "Hostinger application root must be the folder where this branch is deployed."
          echo "Startup file: app.js; Node.js: 22.x; Mode: Production."
