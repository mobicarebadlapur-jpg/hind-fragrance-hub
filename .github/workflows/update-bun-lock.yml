name: Update Bun lockfile

on:
  push:
    branches:
      - fix/hostinger-passenger-ssr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    if: github.ref == 'refs/heads/fix/hostinger-passenger-ssr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hostinger-passenger-ssr
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update lockfile from package manifest
        run: bun install

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: update bun lockfile"
          git push origin fix/hostinger-passenger-ssr
